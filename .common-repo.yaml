# Local consumption — apply our own source files to this repo, with shared
# dev tooling (CI, release, pre-commit) composed from the upstream template.
- self:
    - repo:
        url: https://github.com/common-repo/upstream
        ref: v2.3.0
    - include:
        - "src/**"
    - rename:
        - "^src/(.*)$": "$1"

# Source API — what consumers inherit.
# The thin stubs are re-included narrowly with `if-exists: preserve` so
# consumers with bespoke scripts (e.g. an existing script/test) keep them
# across re-propagations. Last-op-wins re-stamps only these paths.
# The `rename:` must come after both includes: an include that runs after
# it re-adds the stubs under src/script/, where nothing renames them.
- include:
    - "src/**"
- include:
    - "src/script/bootstrap"
    - "src/script/setup"
    - "src/script/update"
    - "src/script/test"
    - "src/script/cibuild"
    - "src/script/server"
    - "src/script/console"
  if-exists: preserve
- rename:
    - "^src/(.*)$": "$1"
