name: CI
on:
  pull_request: null
  push:
    branches:
    - main
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: common-repo/semantic-release/ci/${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: j178/prek-action@53276d8b0d10f8b6672aa85b4588c6921d0370cc
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: common-repo/setup-common-repo@887d2b31e6678fb650d1b1b6fb6097afa5528310
      with:
        version: v0.38.2
    - name: Validate configuration
      run: common-repo validate
    - name: Check managed files
      run: common-repo diff
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Run tests
      run: |
        [ ! -x "script/test" ] || script/test
